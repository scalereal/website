<section id="contact-form" class="section-contact bg-gradient">
  <div class="container">
    <div class="row contact-us-wrapper">
      <!-- INFO -->
      <div class="col-lg-5">
        <h2 class="section-contact-title">Contact Information</h2>

        <div class="contact-card">
          <div class="icons-box">
            <i class="icon-mail"></i>
          </div>
          <div class="contact-content">
            <span class="section-contact-label">Email</span>
            <p>info@scalereal.com</p>
          </div>
        </div>

        <div class="contact-card">
          <div class="icons-box">
            <i class="icon-map-pin"></i>
          </div>
          <div class="contact-content">
            <span class="section-contact-label">Location</span>
            <p>Remote-First • Global Team</p>
          </div>
        </div>

        <div class="contact-card">
          <div class="icons-box">
            <i class="icon-clock"></i>
          </div>
          <div class="contact-content">
            <span class="section-contact-label">Response Time</span>
            <p>Within 48 hours</p>
          </div>
        </div>

        <div class="quick-chat">
          <h3>Prefer a Quick Chat?</h3>
          <p>
            Schedule a 30-minute discovery call to discuss your project
            requirements.
          </p>
          <a href="javascript:void(0)" class="sr-btn secondary" data-cal-link="atul-shashikumar-dtgid6/scalereal-introduction-call" data-cal-namespace="scalereal-introduction-call" data-cal-config='{"layout":"month_view","useSlotsViewOnSmallScreen":"true"}'>Schedule a Call</a>
        </div>
      </div>

      <!-- FORM -->
      <div class="col-lg-5">
        <h2 class="section-contact-title">Send Us a Message</h2>
        <div class="contact-form">
          <form id="contactForm" novalidate>
            <div class="row">
              <div class="col-12 col-md-6 form-group">
                <label for="username" class="text-light-grey">Your Name</label>
                <input
                  type="text"
                  id="username"
                  name="username"
                  class="form-control"
                  placeholder="John Doe"
                  maxlength="60"
                  autocomplete="name"
                />
                <span class="input-error" id="usernameError"></span>
              </div>
              <div class="col-12 col-md-6 form-group">
                <label for="email" class="text-light-grey">Email Address</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-control"
                  placeholder="john@company.com"
                  maxlength="254"
                  autocomplete="email"
                />
                <span class="input-error" id="emailError"></span>
              </div>
            </div>
            <div class="form-group">
              <label for="subject" class="text-light-grey">Company Name</label>
              <input
                type="text"
                id="subject"
                name="subject"
                class="form-control"
                placeholder="Your company"
                maxlength="100"
                autocomplete="organization"
              />
              <span class="input-error" id="subjectError"></span>
            </div>
            <div class="form-group">
              <label for="message" class="text-light-grey"
                >Project Details</label
              >
              <textarea
                name="message"
                class="form-control"
                id="message"
                rows="5"
                placeholder="Tell us about your project, requirements, timeline..."
                maxlength="3000"
              ></textarea>
              <span class="input-error" id="messageError"></span>
            </div>
            <button type="submit" id="sendButton" class="sr-btn primary text-white">
              <span id="sendButtonText">Send Message</span>
              <i id="sendButtonIcon" class="icon-arrow-right"></i>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  function showToast(message, type = "success") {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.className = "show " + type;

    setTimeout(() => {
      toast.className = toast.className.replace("show", "").trim();
    }, 3000);
  }

  // Strip control characters, trim, collapse internal whitespace.
  function sanitize(value) {
    return String(value)
      .replace(/[\u0000-\u001F\u007F]/g, "")
      .trim()
      .replace(/\s+/g, " ");
  }

  // Applied to EVERY field: angle brackets are never legitimate input here,
  // and are the primary vector for HTML/script injection into downstream
  // emails, CRM records, or admin dashboards that might render this data.
  const ANGLE_BRACKET_RE = /[<>]/;
  const URL_RE = /(https?:\/\/|www\.)/i;

  const NAME_RE = /^[A-Za-zÀ-ÖØ-öø-ÿ]+(?:[ '\-][A-Za-zÀ-ÖØ-öø-ÿ]+)*$/;
  const EMAIL_RE =
    /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
  const COMPANY_RE = /^[A-Za-zÀ-ÖØ-öø-ÿ0-9 .,'&\-]+$/;

  function validations(name, rawValue) {
    const value = sanitize(rawValue);

    switch (name) {
      case "username":
        if (value === "") {
          return "Please enter your name.";
        } else if (value.length > 60) {
          return "Please enter a valid name";
        } else if (ANGLE_BRACKET_RE.test(value)) {
          return "Please enter a valid name";
        } else if (!NAME_RE.test(value)) {
          return "Please enter a valid name";
        } else {
          return "";
        }

      case "email":
        if (value === "") {
          return "Please enter your email.";
        } else if (value.length > 254) {
          return "Please enter a valid email";
        } else if (ANGLE_BRACKET_RE.test(value) || !EMAIL_RE.test(value)) {
          return "Please enter a valid email.";
        } else {
          return "";
        }

      case "subject":
        if (value === "") {
          return "Please enter your company name.";
        } else if (value.length <= 3) {
          return "The length of subject should be more than 3 characters.";
        } else if (value.length > 100) {
          return "Company name should be under 100 characters.";
        } else if (ANGLE_BRACKET_RE.test(value) || URL_RE.test(value) || !COMPANY_RE.test(value)) {
          return "Company name contains invalid characters or links.";
        } else {
          return "";
        }

      case "message":
        if (value === "") {
          return "Please enter your details.";
        } else if (value.length <= 100) {
          return "The length of message should be more than 100 characters.";
        } else if (value.length > 3000) {
          return "Message should be under 3000 characters.";
        } else if (ANGLE_BRACKET_RE.test(value)) {
          return "Please remove angle brackets ( < or > ) from your message.";
        } else if (URL_RE.test(value)) {
          return "Please don't include links in the project details.";
        } else {
          return "";
        }

      default:
        return "";
    }
  }

  const contactForm = document.getElementById("contactForm");
  const username = document.getElementById("username"),
    usernameError = document.getElementById("usernameError");
  const email = document.getElementById("email"),
    emailError = document.getElementById("emailError");
  const subject = document.getElementById("subject"),
    subjectError = document.getElementById("subjectError");
  const message = document.getElementById("message"),
    messageError = document.getElementById("messageError");

  username.addEventListener("input", () => {
    usernameError.innerText = validations("username", username.value);
  });

  email.addEventListener("input", () => {
    emailError.innerText = validations("email", email.value);
  });

  subject.addEventListener("input", () => {
    subjectError.innerText = validations("subject", subject.value);
  });

  message.addEventListener("input", () => {
    messageError.innerText = validations("message", message.value);
  });

  const sendButton = document.getElementById("sendButton");
  const sendButtonText = document.getElementById("sendButtonText");
  const sendButtonIcon = document.getElementById("sendButtonIcon");
  contactForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const usernameValue = sanitize(username.value);
    const emailValue = sanitize(email.value);
    const subjectValue = sanitize(subject.value);
    const messageValue = sanitize(message.value);

    username.value = usernameValue;
    email.value = emailValue;
    subject.value = subjectValue;
    message.value = messageValue;

    const usernameErrorText = validations("username", usernameValue);
    const emailErrorText = validations("email", emailValue);
    const subjectErrorText = validations("subject", subjectValue);
    const messageErrorText = validations("message", messageValue);

    usernameError.innerText = usernameErrorText;
    emailError.innerText = emailErrorText;
    subjectError.innerText = subjectErrorText;
    messageError.innerText = messageErrorText;

    if (
      usernameErrorText === "" &&
      emailErrorText === "" &&
      subjectErrorText === "" &&
      messageErrorText === ""
    ) {
      try {
        sendButton.disabled = true;
        sendButtonText.textContent = "Sending...";
        sendButtonIcon.classList.add("d-none");

        const payload = {
          name: usernameValue,
          email: emailValue,
          company: subjectValue,
          details: messageValue,
        };

        const res = await fetch(`/.netlify/functions/notify-email`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const data = await res.json();
        if (res.ok) {
          showToast("Message sent successfully!", "success");
          contactForm.reset();
        } else {
          showToast("Error: " + (data.error || res.statusText), "error");
        }
      } catch (error) {
        console.error("Error sending to CRM:", error);
        showToast("Error: ❌ Something went wrong.", "error");
      } finally {
        sendButton.disabled = false;
        sendButtonText.textContent = "Send Message";
        sendButtonIcon.classList.remove("d-none");
      }
    }
  });
</script>
